<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NINE · Ship Intelligence Command</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a10;--bg2:rgba(14,18,26,.82);--line:#2a2925;--line2:#3a3832;--txt:#ece8df;--mut:#8f8a7e;--dim:#5e5a51;--amb:#d9a441;--red:#d4483b;--ok:#9db57a;
--disp:'Instrument Serif',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px}
a{color:inherit}button,input,select{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--amb);outline-offset:2px}
.top{display:flex;align-items:center;gap:28px;padding:14px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-family:var(--disp);font-size:26px;letter-spacing:.02em}.logo small{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.2em;margin-left:10px}
nav{display:flex;gap:2px}nav a{text-decoration:none;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:8px 12px;border-bottom:1px solid transparent}
nav a.on{color:var(--txt);border-color:var(--amb)}nav a:hover{color:var(--txt)}
.sys{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:10.5px;color:var(--mut)}.sys span:before{content:'';display:inline-block;width:6px;height:6px;margin-right:6px;background:var(--dim)}
.sys span.ok:before{background:var(--ok)}.sys span.warn:before{background:var(--amb)}
main{padding:26px 28px 60px;max-width:1440px;margin:0 auto}
.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--mut);text-transform:uppercase}
h1{font-family:var(--disp);font-weight:400;font-size:clamp(38px,5vw,68px);line-height:.98;margin:6px 0 8px}h1 i{color:var(--amb)}
h2{font-family:var(--disp);font-weight:400;font-size:34px;margin:4px 0 14px}
.lede{color:var(--mut);max-width:620px;margin:0}
.btn{background:transparent;border:1px solid var(--line2);padding:9px 14px;cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em}.btn:hover{border-color:var(--txt)}
.btn.pri{background:var(--amb);color:#14120d;border-color:var(--amb);font-weight:500}.btn.danger{border-color:var(--red);color:var(--red)}.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.deck{display:grid;grid-template-columns:1fr 360px;gap:22px;margin-top:22px}
.panel{border:1px solid var(--line);background:var(--bg2);padding:16px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-top:22px}
.metrics div{padding:14px 16px;border-right:1px solid var(--line)}.metrics div:last-child{border:0}.metrics b{font-family:var(--disp);font-size:40px;font-weight:400;display:block;line-height:1}.metrics span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
#serpent{width:100%;height:auto;display:block;position:relative}.hero3{position:relative}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sp-path{fill:none;stroke:var(--line2);stroke-width:1.5}.sp-run{fill:none;stroke:var(--amb);stroke-width:1.5;stroke-dasharray:3 9}
.st circle.c{fill:var(--bg);stroke:var(--dim);stroke-width:1.5;transition:all .3s}.st text{font-family:var(--mono);font-size:10px;fill:var(--mut);letter-spacing:.12em}.st text.n{fill:var(--dim);font-size:9px}
.st{cursor:pointer}.st:hover circle.c{stroke:var(--txt)}
.st.running circle.c{stroke:var(--amb);fill:#2a2213}.st.done circle.c{stroke:var(--ok);fill:#1b2116}.st.done.fault circle.c{stroke:var(--red);fill:#2a1513}
.st.error circle.c{stroke:var(--red);fill:var(--red)}.st.awaiting-approval circle.c{stroke:var(--amb);fill:var(--amb)}.st.skipped circle.c{stroke:var(--line2);fill:var(--bg)}.st.skipped text{fill:var(--dim)}
.st.running circle.c,.st.awaiting-approval circle.c{animation:beat 1.1s infinite}@keyframes beat{50%{r:13}}
.st.done text:not(.n),.st.running text:not(.n),.st.awaiting-approval text:not(.n){fill:var(--txt)}
.tl{font-family:var(--mono);font-size:11.5px}.tl>div{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}.tl .s{color:var(--mut)}.tl>div.row{display:flex;justify-content:space-between}
.mark{display:inline-block;width:8px;height:8px;margin-top:4px;background:var(--dim)}.mark.done{background:var(--ok)}.mark.running,.mark.awaiting-approval{background:var(--amb)}.mark.error{background:var(--red)}.mark.skipped{background:transparent;border:1px solid var(--dim)}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:2px 7px;border:1px solid var(--line2);text-transform:uppercase;white-space:nowrap}
.badge.f{border-color:var(--red);color:var(--red)}.badge.l{color:var(--mut)}.badge.a{border-color:var(--amb);color:var(--amb)}.badge.ok{border-color:var(--ok);color:var(--ok)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--mut);font-weight:400;text-transform:uppercase}
td.m,.mono{font-family:var(--mono);font-size:12px}tr.click{cursor:pointer}tr.click:hover td{background:#1c1b18}tr.sel td{background:#221f17}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.filters input,.filters select{background:var(--bg2);border:1px solid var(--line2);padding:8px 10px;font-family:var(--mono);font-size:12px}
.split{display:grid;grid-template-columns:1.35fr 1fr;gap:22px}
pre{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11.5px;background:#0b0b0a;border:1px solid var(--line);padding:12px;margin:8px 0;max-height:360px;overflow:auto}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase;margin-top:14px}
.fact{border-left:2px solid var(--amb);padding:4px 10px;margin:6px 0}.fact.r{border-color:var(--red)}
.drawer{position:fixed;top:0;right:0;width:520px;max-width:95vw;height:100%;background:var(--bg2);border-left:1px solid var(--line2);padding:22px;overflow:auto;transform:translateX(100%);transition:transform .3s;z-index:20}
.drawer.open{transform:none}.x{position:absolute;right:16px;top:14px}
.empty{color:var(--mut);font-family:var(--mono);font-size:12px;padding:20px 0}.err{color:var(--red)}
.notice{border:1px solid var(--amb);color:var(--amb);padding:8px 12px;font-family:var(--mono);font-size:11.5px;margin:12px 0}
.skip{position:absolute;right:28px;top:84px;font-family:var(--mono);font-size:10.5px;color:var(--mut);background:none;border:0;cursor:pointer;text-decoration:underline}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}.top{background:rgba(7,10,16,.85)!important;backdrop-filter:blur(6px)}body{background:radial-gradient(1200px 700px at 75% -10%,#0f1a2c 0%,transparent 60%),#070a10}
.stream div{display:grid;grid-template-columns:90px 110px 70px 90px 1fr;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;animation:sin .4s}@keyframes sin{from{opacity:0;transform:translateY(-6px)}}
.bigstep{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line);margin:18px 0}.bigstep div{padding:14px;border-right:1px solid var(--line)}.bigstep div:last-child{border:0}.bigstep b{display:block;font-family:var(--disp);font-size:22px;font-weight:400;margin:4px 0}.bigstep span{color:var(--mut);font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.rm *{animation:none!important;transition:none!important}
@media(max-width:1000px){.deck,.split{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}nav{flex-wrap:wrap}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="top">
  <div class="logo">NINE<small>AURORA · SHIP INTELLIGENCE · TEAM5</small></div>
  <nav id="nav">
    <a href="#/">Overview</a><a href="#/live">Live</a><a href="#/agents">Agents</a><a href="#/incidents">Logs</a><a href="#/memory">Memory</a><a href="#/schedule">Crew &amp; Schedule</a><a href="#/reports">Reports</a>
  </nav>
  <div class="sys" id="sys"><span>backend</span></div>
</div>
<main id="view"></main>
<div class="drawer" id="drawer" role="dialog" aria-label="details"><button class="btn x" onclick="closeD()">Close</button><div id="dbody"></div></div>

<script>
const STAGES=[['telemetry','Read log'],['verdict','Fault check'],['analysis','Find the lie'],['dispatch','Pick crew'],['memory','Similar cases'],['response','Plan fix'],['scheduling','Book repair'],['audit','Send + report']];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ST=null, CUR=null, POLL=null, INTRO=true;
const api=async(p,o)=>{const r=await fetch(p,o?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}:{});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j};
function openD(h){$('#dbody').innerHTML=h;$('#drawer').classList.add('open')} function closeD(){$('#drawer').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});
async function status(){try{ST=await api('/api/status');$('#sys').innerHTML=`<span class="ok">backend</span><span class="${ST.llm.connected?'ok':'warn'}">llm ${ST.llm.connected?ST.llm.model:'local-demo'}</span><span class="${ST.vector.backend.startsWith('chroma')?'ok':'warn'}">vector ${ST.vector.count}</span><span class="ok">scheduler ${ST.scheduled}</span><span class="${ST.inbox?'ok':'warn'}">inbox ${ST.inbox?'live':'outbox'}</span>`}catch(e){$('#sys').innerHTML='<span>backend offline: start python server.py</span>'}}

// ---------------------------------------------------------------- serpent pipeline
function serpent(){const W=1000,H=560,cx=500,cy=280,R=190;
 const d=`M${cx},${cy-R} a${R},${R} 0 1,1 -0.01,0`;
 let g=`<div class="hero3"><canvas id="fx" width="2000" height="1120" aria-hidden="true"></canvas><svg id="serpent" viewBox="0 0 ${W} ${H}" role="img" aria-label="incident response ring"><path id="spPath" class="sp-path" d="${d}" style="stroke:transparent"/><path id="spRun" class="sp-run" d="${d}" opacity="0"/><circle id="pk" r="6" fill="#ffd27a" opacity="0" filter="url(#gl)"/><defs><filter id="gl"><feGaussianBlur stdDeviation="3"/></filter></defs>
 <text x="${cx}" y="${cy-6}" text-anchor="middle" style="font-family:var(--disp);font-size:34px;fill:var(--txt)">NINE</text><text id="coreTxt" x="${cx}" y="${cy+18}" text-anchor="middle" style="font-family:var(--mono);font-size:10px;letter-spacing:.2em;fill:var(--mut)">CORE IDLE</text>`;
 STAGES.forEach(([k,lbl],i)=>{const a=-Math.PI/2+i*2*Math.PI/8, x=cx+R*Math.cos(a), y=cy+R*Math.sin(a), lx=cx+(R+62)*Math.cos(a), ly=cy+(R+52)*Math.sin(a);
  const anc=Math.abs(Math.cos(a))<.3?'middle':(Math.cos(a)>0?'start':'end');
  g+=`<g class="st" id="st-${k}" tabindex="0" role="button" aria-label="${lbl}" onclick="stageInfo('${k}')" onkeydown="if(event.key==='Enter')stageInfo('${k}')"><circle class="c" cx="${x}" cy="${y}" r="10"/><text class="n" x="${lx}" y="${ly-9}" text-anchor="${anc}">0${i+1}</text><text x="${lx}" y="${ly+5}" text-anchor="${anc}">${lbl.toUpperCase()}</text></g>`});
 return g+'</svg></div>'}
let FX=null;
function startFX(){const cv=$('#fx');if(!cv)return;const c=cv.getContext('2d'),W=cv.width,H=cv.height,cx=W/2,cy=H/2,R=380,rm=document.body.classList.contains('rm')||matchMedia('(prefers-reduced-motion: reduce)').matches;
 const N=170, strands=[...Array(N)].map((_,i)=>{const a=i/N*Math.PI*2;return{a,sx:-200+Math.random()*500,sy:-150+Math.random()*350,len:28+Math.random()*58,w:.6+Math.random()*1.6,d:Math.random()*.6,hot:Math.random()<.18}});
 const cubes=[...Array(26)].map((_,i)=>({x:Math.random()*W,y:Math.random()*H,tx:cx+(i%5-2)*26,ty:cy+((i/5|0)-2.5)*22,s:16+Math.random()*10,d:Math.random()*.4}));
 const t0=performance.now(), ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
 function cube(x,y,s,al){c.save();c.globalAlpha=al;c.translate(x,y);const h=s*.5;
  c.fillStyle='#3a3020';c.beginPath();c.moveTo(0,-h);c.lineTo(s,-h+s*.4);c.lineTo(0,-h+s*.8);c.lineTo(-s,-h+s*.4);c.closePath();c.fill();
  c.fillStyle='#24201a';c.beginPath();c.moveTo(-s,-h+s*.4);c.lineTo(0,-h+s*.8);c.lineTo(0,h+s*.8);c.lineTo(-s,h+s*.4);c.closePath();c.fill();
  c.fillStyle='#2f2a21';c.beginPath();c.moveTo(s,-h+s*.4);c.lineTo(0,-h+s*.8);c.lineTo(0,h+s*.8);c.lineTo(s,h+s*.4);c.closePath();c.fill();
  c.strokeStyle='rgba(217,164,65,.35)';c.lineWidth=1;c.stroke();c.restore()}
 function frame(now){const t=rm?99:(now-t0)/1000;c.clearRect(0,0,W,H);
  const busy=CUR&&CUR.state==='running', fault=CUR&&CUR.stages&&CUR.stages.verdict.output&&CUR.stages.verdict.output.verdict===1;
  // phase A/B: cubes assemble into the core, then fade into it
  const pc=ease((t-0.1)/1.4), fadeC=1-ease((t-1.9)/0.8);
  if(fadeC>0) cubes.forEach(q=>{const p=ease((t-.1-q.d)/1.3);cube(q.x+(q.tx-q.x)*p,q.y+(q.ty-q.y)*p,q.s*(1-.3*p),.9*fadeC)});
  // core glow
  const pulse=busy?(.55+.35*Math.sin(now/180)):.35; const gr=c.createRadialGradient(cx,cy,10,cx,cy,170);gr.addColorStop(0,`rgba(217,164,65,${.28*pulse*pc})`);gr.addColorStop(1,'rgba(217,164,65,0)');c.fillStyle=gr;c.beginPath();c.arc(cx,cy,170,0,7);c.fill();
  // phase C: strands sweep in from the top-left and bend into the orbital ring
  const rot=rm?0:now/9000*(busy?3:1);
  strands.forEach(s=>{const p=ease((t-1.4-s.d)/1.5);if(p<=0)return;const a=s.a+rot, ex=cx+R*Math.cos(a), ey=cy+R*Math.sin(a);
   const ox=cx+(R+s.len)*Math.cos(a), oy=cy+(R+s.len)*Math.sin(a);
   if(p<1){const bx=s.sx+(ex-s.sx)*p, by=s.sy+(ey-s.sy)*p;c.strokeStyle=`rgba(217,164,65,${.18+.5*p})`;c.lineWidth=s.w;c.beginPath();c.moveTo(s.sx+(cx-s.sx)*p*.5,s.sy);c.quadraticCurveTo(cx-120,cy-260,bx,by);c.stroke()}
   else{const L=c.createLinearGradient(ex,ey,ox,oy);const hot=s.hot&&(busy||fault);L.addColorStop(0,hot?'rgba(255,214,140,.95)':'rgba(217,164,65,.75)');L.addColorStop(1,'rgba(217,164,65,0)');
    c.strokeStyle=L;c.lineWidth=s.w*1.4;c.beginPath();c.moveTo(ex,ey);c.lineTo(ox,oy);c.stroke();
    if(s.hot){c.fillStyle=hot?'rgba(255,220,150,.95)':'rgba(255,200,110,.5)';c.beginPath();c.arc(ex,ey,1.8,0,7);c.fill()}}});
  // ring hairline
  c.strokeStyle=`rgba(236,232,223,${.18*ease((t-2.6)/.8)})`;c.lineWidth=1;c.beginPath();c.arc(cx,cy,R-14,0,7);c.stroke();
  const ct=$('#coreTxt');if(ct)ct.textContent=busy?'CORE PROCESSING':CUR&&CUR.state==='awaiting-approval'?'AWAITING APPROVAL':CUR&&CUR.state==='completed'?'INCIDENT RESOLVED':CUR&&CUR.state==='failed'?'STAGE FAILED':'CORE IDLE';
  FX=requestAnimationFrame(frame)}
 cancelAnimationFrame(FX);FX=requestAnimationFrame(frame)}
function drawIntro(){const p=$('#spPath');if(!p)return;const L=p.getTotalLength();if(!INTRO||document.body.classList.contains('rm')){p.style.strokeDasharray='none';return}
 p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.getBoundingClientRect();p.style.transition='stroke-dashoffset 2.2s ease';p.style.strokeDashoffset=0;INTRO=false}
function paint(run){if(!$('#serpent'))return;const fault=run&&run.stages.verdict.output&&run.stages.verdict.output.verdict===1;let lastIdx=-1;
 STAGES.forEach(([k],i)=>{const s=run?run.stages[k].status:'pending';const el=$('#st-'+k);el.setAttribute('class','st '+s+(fault?' fault':''));if(['done','running','awaiting-approval','error'].includes(s))lastIdx=i});
 const run_=$('#spRun');run_.setAttribute('opacity',run&&run.state==='running'?.9:0);
 const pk=$('#pk'),p=$('#spPath');if(run&&lastIdx>=0&&!document.body.classList.contains('rm')){const L=p.getTotalLength();pk.setAttribute('opacity',1);const t=L*(lastIdx/7);const pt=p.getPointAtLength(t);pk.setAttribute('cx',pt.x);pk.setAttribute('cy',pt.y)}}
function stageInfo(k){const lbl=STAGES.find(s=>s[0]===k)[1];if(!CUR){openD(`<div class="kicker">stage</div><h2>${lbl}</h2><p class="empty">No run selected. Press "Run incident response".</p>`);return}
 const s=CUR.stages[k];openD(`<div class="kicker">${CUR.id} · ${CUR.log_id}</div><h2>${lbl}</h2><div class="row"><span class="badge ${s.status==='done'?'ok':s.status==='error'?'f':'a'}">${s.status}</span>${s.ms!=null?`<span class="mono">${s.ms} ms</span>`:''}</div>
 ${s.error?`<div class="lbl">error</div><pre class="err">${esc(s.error)}</pre><button class="btn" onclick="retry('${CUR.id}')">Retry from this stage</button>`:''}
 ${s.status==='awaiting-approval'?approvalBox(CUR):''}<div class="lbl">output</div><pre>${esc(JSON.stringify(s.output??'(not produced yet)',null,1))}</pre>`)}
function approvalBox(r){const b=r.stages.scheduling.output&&r.stages.scheduling.output.proposed_row;const sp=r.stages.dispatch.output&&r.stages.dispatch.output.selected;
 return `<div class="notice">Human approval required. Nothing has been sent or booked yet.</div><div class="mono">Alert to ${esc(sp&&sp.name)} (${esc(sp&&sp.crew_id)}) · book ${esc(b&&b.start)} to ${esc(b&&b.end&&b.end.slice(11))}</div><div class="row" style="margin-top:10px"><button class="btn pri" onclick="approve('${r.id}')">Approve and execute</button><button class="btn danger" onclick="reject('${r.id}')">Reject</button></div>`}
async function startRun(lid){try{if(ST&&!ST.logs)throw new Error('upload a CSV first');const r=await api('/api/runs',lid?{log_id:lid}:{});CUR=r;location.hash='#/';watch(r.id)}catch(e){alert('Could not start run: '+e.message)}}
function watch(id){clearInterval(POLL);POLL=setInterval(async()=>{try{CUR=await api('/api/runs/'+id);paint(CUR);renderTL();if(!['running'].includes(CUR.state)){clearInterval(POLL);status()}}catch(e){clearInterval(POLL)}},450)}
async function approve(id){await api(`/api/runs/${id}/approve`,{});closeD();watch(id)} async function reject(id){CUR=await api(`/api/runs/${id}/reject`,{});closeD();paint(CUR);renderTL();status()}
async function retry(id){await api(`/api/runs/${id}/retry`,{});closeD();watch(id)}
function renderRep(){const el=$('#rep');if(!el||!CUR||!CUR.report)return;const r=CUR.report;
 el.innerHTML=`<div class="row" style="justify-content:space-between"><b class="mono">${r.log_id}</b><span class="badge f">${esc(r.verdict)}</span></div>
 <div class="lbl">why</div>${r.evidence.map(e=>`<div class="fact r">${esc(e)}</div>`).join('')}<div class="lbl">alert</div><div>${esc(r.alert)}</div>
 <div class="lbl">similar past incidents</div><div class="mono">${r.similar_incidents.join(', ')}</div><div class="lbl">repair booked</div><div>${esc(r.repair)}</div>
 <div class="lbl">plan</div><div>${esc(r.recommendation)}</div><div class="mono" style="color:var(--dim);margin-top:8px">plan written by: ${esc(r.llm_mode)}</div>`}
function batchUI(){const go=$('#bgo');if(!go)return;
 const show=async()=>{const b=await api('/api/batch');if(!$('#bstat'))return{state:'done'};if(b.state==='idle'){$('#bstat').textContent='No file uploaded yet. Choose a CSV, then press the button.';return b}
  $('#bstat').innerHTML=`<div>source: ${esc(b.source)} · ${b.rows} logs · state <b style="color:var(--amb)">${b.state}</b></div>${b.true_faults!=null?`<div>checked in ${b.check_seconds}s → <b style="color:var(--red)">${b.true_faults} true faults</b>, ${b.normal} normal (no action)</div><div>${b.unmatched?`<span class=err>${b.unmatched} log_ids not found in the original logs (skipped)</span><br>`:''}sent to agents: ${b.runs.length} of budget ${b.budget}${b.queued!=null?` · ${b.queued} queued (run any one from Incidents)`:''}</div><div style="color:var(--dim)">${esc(b.note)}</div>`:''}`;return b};
 go.onclick=async()=>{go.disabled=true;let body={budget:+$('#bud').value};const f=$('#up').files[0];
  try{if(!f)throw new Error('Choose a CSV file first');body.csv=await f.text();body.name=f.name;const r=await api('/api/batch',body);
   const t=setInterval(async()=>{const b=await show();const runs=await api('/api/runs');if(runs[0]){CUR=runs[0];paint(CUR);renderTL();renderRep()}if(b.state==='done'||!$('#bstat')){clearInterval(t);go.disabled=false;status()}},700)}
  catch(e){$('#bstat').innerHTML=`<span class="err">${esc(e.message)}</span>`;go.disabled=false}};show()}
function renderTL(){renderRep();const el=$('#tl');if(!el)return;if(!CUR){el.innerHTML='<div class="empty">No workflow has run in this session.</div>';return}
 el.innerHTML=`<div class="row" style="justify-content:space-between"><span class="mono">${CUR.id} · ${CUR.log_id}</span><span class="badge ${CUR.state==='completed'?'ok':CUR.state==='failed'?'f':'a'}">${CUR.state}</span></div>`+
 STAGES.map(([k,l])=>{const s=CUR.stages[k];return `<div><i class="mark ${s.status}"></i><span>${l}</span><span class="s">${s.ms!=null?s.ms+' ms':s.status}</span></div>`}).join('')+
 (CUR.state==='awaiting-approval'?`<div style="display:block;border:0;padding-top:10px">${approvalBox(CUR)}</div>`:'')+(CUR.state==='failed'?`<div style="display:block;border:0"><button class="btn" onclick="retry('${CUR.id}')">Retry failed stage</button></div>`:'')+(CUR.summary?`<div style="display:block;border:0;padding-top:8px;color:var(--txt)">${esc(CUR.summary)}</div>`:'')}

// ---------------------------------------------------------------- pages
const PAGES={
 '/':async()=>{await status();const s=ST||{};
  $('#view').innerHTML=`<button class="skip" onclick="document.body.classList.toggle('rm');this.textContent=document.body.classList.contains('rm')?'Motion off':'Reduce motion'">Reduce motion</button>
  <div class="kicker">Overview · data: ${esc(s.logs_source||'none')}</div><h1>The ship speaks. <i>We verify.</i><br>The crew acts.</h1>
  <div class="bigstep"><div><span>1</span><b>Upload logs</b><span>Your CSV: full logs or Team5.csv verdicts</span></div><div><span>2</span><b>Check all</b><span>Every row checked first, no AI credits</span></div><div><span>3</span><b>Faults only</b><span>Normal logs stop. Top faults go on</span></div><div><span>4</span><b>Agents act</b><span>Pick crew, find similar, plan, book</span></div><div><span>5</span><b>Report</b><span>Alert sent, repair booked, report written</span></div></div>
  <div class="metrics"><div><b>${s.logs??'-'}</b><span>logs processed</span></div><div><b style="color:var(--red)">${s.true_faults??'-'}</b><span>true faults (verdict 1)</span></div><div><b style="color:var(--amb)">${s.awaiting??0}</b><span>awaiting approval</span></div><div><b>${s.scheduled??0}</b><span>jobs in schedule.csv</span></div></div>
  <div class="deck"><div class="panel">${serpent()}<div class="row" style="margin-top:10px"><button class="btn pri" onclick="startRun()">Investigate next fault</button><button class="btn" onclick="inspectLatest()">Inspect latest incident</button><span class="mono" style="color:var(--mut)">Click any stage for its real input, output, latency and errors.</span></div></div>
  <div class="panel"><div class="kicker">Execution timeline</div><div class="tl" id="tl"></div></div></div>
  <div class="deck"><div class="panel"><div class="kicker">Upload your log CSV</div>
   <p class="lede" style="margin:8px 0 12px">Accepts the full log file, or a verdict file like Team5.csv (log_id,is_true_fault). Your verdicts are used as-is and joined to the original logs by log_id. Watch it on the Live page.</p>
   <div class="row"><input type="file" id="up" accept=".csv" aria-label="upload log csv" style="font-family:var(--mono);font-size:11px"><label class="mono">agent budget <input id="bud" type="number" min="0" max="50" value="${s.budget??5}" style="width:56px;background:var(--bg);border:1px solid var(--line2);padding:6px"></label>
   <button class="btn pri" id="bgo">Check all logs + run agents</button></div><div id="bstat" class="mono" style="margin-top:12px;color:var(--mut)"></div></div>
   <div class="panel"><div class="kicker">Final incident report</div><div id="rep"><div class="empty">Appears when an incident finishes.</div></div></div></div>`;
  batchUI();
  startFX();paint(CUR);renderTL()},
 '/incidents':async()=>{$('#view').innerHTML=`<div class="kicker">Incident intelligence</div><h2>Every log, judged.</h2>
  <div class="filters"><input id="fq" placeholder="search log id or message" aria-label="search"><select id="fv" aria-label="verdict"><option value="">all verdicts</option><option value="1">1 · true fault</option><option value="0">0 · lie</option></select>
  <select id="fm" aria-label="module"><option value="">all modules</option><option>Antenna</option><option>Notice-Bus</option><option>Lab-Power</option><option>Life-Support</option></select>
  <select id="fs" aria-label="severity"><option value="">all severity</option><option>CRIT</option><option>ERROR</option><option>WARN</option><option>OK</option></select></div>
  <div class="split"><div><div class="mono" id="cnt" style="color:var(--mut)"></div><table><thead><tr><th>log</th><th>module</th><th>status</th><th>risk</th><th>verdict</th><th>response</th></tr></thead><tbody id="tb"></tbody></table></div><div class="panel" id="det"><div class="empty">Select an incident.</div></div></div>`;
  const load=async()=>{const p=new URLSearchParams({q:$('#fq').value,verdict:$('#fv').value,module:$('#fm').value,status:$('#fs').value,limit:150});const d=await api('/api/incidents?'+p);
   $('#cnt').textContent=`${d.total} matching logs (showing ${d.rows.length}, highest risk first)`;
   $('#tb').innerHTML=d.rows.map(r=>`<tr class="click" tabindex="0" onclick="incDetail('${r.log_id}',this)" onkeydown="if(event.key==='Enter')this.click()"><td class="m">${r.log_id}</td><td>${r.module}</td><td class="m">${r.status}</td><td class="m">${r.risk.toFixed(3)}</td><td><span class="badge ${r.verdict?'f':'l'}">${r.verdict?'1 fault':'0 lie'}</span></td><td class="m" style="color:var(--mut)">${r.response}</td></tr>`).join('')||'<tr><td class="empty" colspan="6">No logs match.</td></tr>'};
  ['#fq','#fv','#fm','#fs'].forEach(s=>$(s).addEventListener(s==='#fq'?'input':'change',load));load()},
 '/agents':async()=>{const runs=await api('/api/runs');const r=CUR||runs[0];
  $('#view').innerHTML=`<div class="kicker">Agent operations</div><h2>What each agent actually did.</h2>${!r?'<p class="empty">No runs yet. Start one from the command deck.</p>':''}<div id="ag"></div>`;
  if(!r)return;CUR=CUR||r;const R=await api('/api/runs/'+r.id);const inv=R.stages.response.output;
  $('#ag').innerHTML=`<div class="row"><span class="mono">${R.id} · ${R.log_id}</span><span class="badge a">${R.state}</span>${R.state==='running'?'':`<button class="btn" onclick="startRun('${R.log_id}')">Re-run this incident</button>`}</div>
  <div class="split" style="margin-top:14px"><div>${STAGES.map(([k,l])=>{const s=R.stages[k];return `<div class="panel" style="margin-bottom:8px"><div class="row" style="justify-content:space-between"><b>${l}</b><span><span class="badge ${s.status==='done'?'ok':s.status==='error'?'f':'a'}">${s.status}</span> <span class="mono">${s.ms!=null?s.ms+' ms':''}</span></span></div>${s.error?`<pre class="err">${esc(s.error)}</pre><button class="btn" onclick="retry('${R.id}')">Retry</button>`:''}<pre>${esc(JSON.stringify(s.output??'',null,1)).slice(0,900)}</pre></div>`}).join('')}</div>
  <div><div class="panel"><div class="kicker">Investigation · ${esc(inv?inv.mode:'not run')}</div>${inv?`<div class="lbl">provider / model</div><div class="mono">${esc(inv.provider||'none')} / ${esc(inv.model||'none')}</div>
  <div class="lbl">observed (original log)</div><pre>${esc(R.ctx.log&&R.ctx.log.message)}</pre><div class="lbl">model prediction (Round 1)</div><div class="mono">verdict ${R.ctx.verdict}, risk ${(R.ctx.prob||0).toFixed(3)}</div>
  <div class="lbl">retrieved evidence (untrusted)</div>${(R.ctx.similar||[]).slice(0,3).map(s=>`<div class="fact mono">${s.log_id} · sim ${s.score} · crew verdict ${s.true_fault}</div>`).join('')}
  <div class="lbl">generated: what happened</div><p>${esc(inv.output.what_happened)}</p><div class="lbl">generated: recommended action</div><p>${esc(inv.output.recommended_action)}</p>
  <div class="lbl">supporting facts</div>${(inv.output.supporting_facts||[]).map(f=>`<div class="fact">${esc(f)}</div>`).join('')}<div class="lbl">uncertain</div>${(inv.output.uncertainties||[]).map(f=>`<div class="fact r">${esc(f)}</div>`).join('')}`:'<p class="empty">Response stage has not run.</p>'}
  ${R.state==='awaiting-approval'?approvalBox(R):''}</div></div></div>`},
 '/memory':async()=>{await status();$('#view').innerHTML=`<div class="kicker">Vector memory</div><h2>What happened like this before?</h2>
  <div class="panel row" style="justify-content:space-between"><span class="mono">backend: ${esc(ST.vector.backend)} · indexed records: <b id="mc">${ST.vector.count}</b> (labelled historical logs from train + val)</span><button class="btn" id="rx">Re-index</button></div>
  ${ST.vector.backend.startsWith('chroma')?'':'<div class="notice">Chroma is not installed on this machine, so memory uses TF-IDF vectors with cosine similarity (lexical, not semantic embeddings). Run pip install chromadb and restart for real embeddings.</div>'}
  <div class="filters"><input id="mq" style="flex:1" placeholder="e.g. seal breach life support calm message" value="O2 partial pressure falling on Life-Support"><button class="btn pri" id="mgo">Search</button></div><div id="mres"></div>`;
  const go=async()=>{$('#mres').innerHTML='<div class="empty">Searching...</div>';try{const d=await api('/api/memory/search?q='+encodeURIComponent($('#mq').value));
   $('#mres').innerHTML=`<table><thead><tr><th>source log</th><th>similarity</th><th>crew verdict</th><th>excerpt</th></tr></thead><tbody>${(window.MR=d.results).map((r,i)=>`<tr class="click" tabindex="0" onclick="openD('<div class=kicker>retrieved record</div><h2>'+MR[${i}].log_id+'</h2><pre>'+esc(JSON.stringify(MR[${i}],null,1))+'</pre>')"><td class="m">${r.log_id}</td><td class="m">${r.score}</td><td><span class="badge ${r.meta.true_fault?'f':'l'}">${r.meta.true_fault?'true fault':'lie'}</span></td><td>${esc(r.text)}</td></tr>`).join('')}</tbody></table>`}catch(e){$('#mres').innerHTML=`<div class="err">${esc(e.message)}</div>`}};
  $('#mgo').onclick=go;$('#mq').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  $('#rx').onclick=async()=>{$('#rx').disabled=true;$('#rx').textContent='Indexing...';try{const r=await api('/api/memory/reindex',{});$('#mc').textContent=r.count;$('#rx').textContent=`Indexed in ${r.seconds}s`}catch(e){$('#rx').textContent='Failed: '+e.message}$('#rx').disabled=false};go()},
 '/schedule':async()=>{const d=await api('/api/schedule');
  $('#view').innerHTML=`<div class="kicker">Crew scheduler</div><h2>schedule.csv</h2><div class="row"><span class="badge ${d.exists?'ok':'a'}">${d.exists?'file generated':'not generated yet'}</span><span class="badge ${d.issues.length?'f':'ok'}">${d.issues.length?d.issues.length+' validation issues':'valid: columns, times, crew ids, no conflicts'}</span><a class="btn" href="/api/schedule.csv" download>Download schedule.csv</a></div>
  ${d.issues.map(i=>`<div class="err mono">${esc(i)}</div>`).join('')}<div class="split" style="margin-top:14px"><table><thead><tr><th>log_id</th><th>crew_id</th><th>start</th><th>end</th><th>job</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td class="m">${r.log_id}</td><td class="m">${r.crew_id}</td><td class="m">${r.start}</td><td class="m">${r.end}</td><td>${esc(r.job)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No approved jobs yet. Approve a run to append the first row.</td></tr>'}</tbody></table>
  <div class="panel"><div class="kicker">Crew roster</div><table><tbody>${d.crew.map(c=>`<tr><td class="m">${c.crew_id}</td><td>${esc(c.name)}</td><td style="color:var(--mut)">${esc(c.role)}</td><td class="m">${esc(c.module)}</td></tr>`).join('')}</tbody></table><div class="mono" style="color:var(--mut);margin-top:8px">source: ${esc(ST?ST.crew_source:'')}</div></div></div>`},
 '/trace':async()=>{const runs=await api('/api/runs');
  $('#view').innerHTML=`<div class="kicker">System trace</div><h2>Every run, every stage.</h2><table><thead><tr><th>run</th><th>incident</th><th>created</th><th>state</th><th>stages</th><th>total ms</th><th>retries</th></tr></thead><tbody>${runs.map(r=>`<tr class="click" onclick="CUR=null;openTrace('${r.id}')"><td class="m">${r.id}</td><td class="m"><a href="#/incidents" onclick="event.stopPropagation()">${r.log_id}</a></td><td class="m">${r.created}</td><td><span class="badge ${r.state==='completed'?'ok':r.state==='failed'?'f':'a'}">${r.state}</span></td><td>${STAGES.map(([k])=>`<i class="mark ${r.stages[k].status}" title="${k}: ${r.stages[k].status}"></i>`).join(' ')}</td><td class="m">${Object.values(r.stages).reduce((a,s)=>a+(s.ms||0),0)}</td><td class="m">${(r.retries||[]).length}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No runs recorded yet.</td></tr>'}</tbody></table>`}
};
async function openTrace(id){const r=await api('/api/runs/'+id);openD(`<div class="kicker">execution record</div><h2>${r.id}</h2><div class="row"><span class="mono">${r.log_id}</span><button class="btn" onclick="CUR=null;closeD();loadRun('${r.id}')">Open on command deck</button></div><pre>${esc(JSON.stringify({state:r.state,retries:r.retries||[],stages:r.stages},null,1))}</pre>`)}
async function loadRun(id){CUR=await api('/api/runs/'+id);location.hash='#/';setTimeout(()=>{paint(CUR);renderTL()},60)}
async function incDetail(lid,tr){document.querySelectorAll('tr.sel').forEach(t=>t.classList.remove('sel'));tr&&tr.classList.add('sel');const d=await api('/api/incidents/'+lid);
 $('#det').innerHTML=`<div class="kicker">incident</div><h2>${lid}</h2><div class="row"><span class="badge ${d.verdict?'f':'l'}">verdict ${d.verdict}</span><span class="mono">source: ${esc(d.verdict_source)}</span><span class="mono">risk score ${d.risk} · threshold ${d.threshold}</span></div>
 <div class="lbl">original log (source of truth)</div><pre>${esc(JSON.stringify(d.log,null,1))}</pre><div class="lbl">parsed from NINE's message</div><pre>${esc(JSON.stringify(d.extracted,null,1))}</pre>
 <div class="lbl">why the classifier flags it</div>${d.signals.length?d.signals.map(s=>`<div class="fact r">${esc(s)}</div>`).join(''):'<div class="empty">Verdict 0: no response required.</div>'}
 <div class="row" style="margin-top:12px"><button class="btn pri" onclick="startRun('${lid}')">Run response workflow</button></div>`}
async function inspectLatest(){const runs=await api('/api/runs');location.hash='#/incidents';setTimeout(()=>{if(runs[0])incDetail(runs[0].log_id)},300)}
async function route(){const h=(location.hash||'#/').slice(1)||'/';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h));closeD();
 try{await (PAGES[h]||PAGES['/'])()}catch(e){$('#view').innerHTML=`<div class="err">Backend unreachable or error: ${esc(e.message)}. Start it with <span class="mono">python server.py</span>.</div>`}}
(function stars(){const cv=$('#stars'),c=cv.getContext('2d');let W,H,st=[];function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;st=[...Array(160)].map(()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+.2,a:Math.random()*.6+.15,v:Math.random()*.04+.01}))}rs();addEventListener('resize',rs);
 const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;(function f(){c.clearRect(0,0,W,H);c.strokeStyle='rgba(120,150,190,.06)';c.lineWidth=1;c.beginPath();c.ellipse(W*.78,H*.1,W*.55,H*.42,-.25,0,7);c.stroke();c.beginPath();c.ellipse(W*.78,H*.1,W*.38,H*.28,-.25,0,7);c.stroke();
 st.forEach(s=>{if(!rm){s.x-=s.v;if(s.x<0)s.x=W}c.fillStyle=`rgba(220,228,240,${s.a})`;c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill()});if(!rm)requestAnimationFrame(f)})()})();
PAGES['/live']=async()=>{$('#view').innerHTML=`<div class="kicker">Live incident stream</div><h2>Logs arriving and being checked.</h2>
 <p class="lede">Upload a CSV on Overview. Every row is checked first. Faults turn red and go to the agents (up to the budget). Normal logs stop here.</p><div id="lprog" class="mono" style="margin:12px 0;color:var(--mut)"></div>
 <div class="stream" id="lst"><div style="color:var(--mut)"><span>log</span><span>module</span><span>status</span><span>verdict</span><span>message</span></div></div>`;
 const seen=new Set();const tick=async()=>{if(!$('#lst'))return clearInterval(LT);const d=await api('/api/stream');if(!$('#lst'))return;const b=d.batch;
  $('#lprog').innerHTML=b.state==='idle'?'No upload yet. Go to Overview and choose a CSV.':`${esc(b.source)} · ${b.done_rows||0}/${b.rows} checked · state <b style="color:var(--amb)">${b.state}</b>${b.true_faults!=null?` · <b style="color:var(--red)">${b.true_faults} faults</b> · ${b.normal} normal · ${b.runs.length} sent to agents`:''}`;
  d.rows.filter(r=>!seen.has(r.log_id)).slice(-25).forEach(r=>{seen.add(r.log_id);const e=document.createElement('div');e.innerHTML=`<span>${r.log_id}</span><span>${r.module}</span><span>${r.status}</span><span><span class="badge ${r.verdict?'f':'l'}">${r.verdict?'fault':'normal'}</span></span><span style="color:${r.verdict?'var(--txt)':'var(--mut)'}">${esc(r.message)}</span>`;$('#lst').children[0].after(e)});
  while($('#lst').children.length>40)$('#lst').lastChild.remove()};let LT=setInterval(tick,500);tick()};
PAGES['/reports']=async()=>{const d=await api('/api/reports');$('#view').innerHTML=`<div class="kicker">Reports</div><h2>Final incident reports.</h2><p class="lede">One report per fault the agents handled: verdict, why, alert, similar cases and the booked repair.</p>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;margin-top:16px">${d.map(r=>`<div class="panel"><div class="row" style="justify-content:space-between"><b class="mono">${r.log_id}</b><span class="badge f">${esc(r.verdict)}</span></div>
 <div class="lbl">why</div>${r.evidence.map(e=>`<div class="fact r">${esc(e)}</div>`).join('')}<div class="lbl">alert</div><div>${esc(r.alert)}</div><div class="lbl">similar past incidents</div><div class="mono">${r.similar_incidents.join(', ')}</div>
 <div class="lbl">repair</div><div>${esc(r.repair)}</div><div class="mono" style="color:var(--dim);margin-top:8px">${r.run} · ${r.created}</div></div>`).join('')||'<p class="empty">No reports yet. Upload a CSV on Overview and run the agents.</p>'}</div>`};
window.addEventListener('hashchange',route);status().then(route);setInterval(status,5000);
(async()=>{try{const runs=await api('/api/runs');if(runs[0]&&!CUR){CUR=runs[0];paint(CUR);renderTL()}}catch(e){}})();
</script>
</body>
</html>
